name: Supply chain

# Guards the dependency policy documented in CLAUDE.md. The point is that the
# policy fails loudly when violated, instead of eroding one convenient package
# at a time.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Ceiling for the whole installed tree. Raising this is a deliberate decision,
  # never a side effect of adding a package.
  MAX_PACKAGES: 12

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Nenhuma dependencia de runtime
        run: |
          count=$(node -e 'const p=require("./package.json");process.stdout.write(String(Object.keys(p.dependencies||{}).length))')
          if [ "$count" != "0" ]; then
            echo "::error::package.json declara $count dependencia(s) de runtime."
            echo "O site nao pode depender de nada em runtime — nada de npm chega ao browser."
            exit 1
          fi
          echo "ok: zero dependencias de runtime"

      - name: Actions pinadas por SHA
        run: |
          # Uma tag pode ser reapontada pelo dono da action a qualquer momento;
          # um SHA de commit, nao. Aceita apenas ref de 40 hex.
          bad=$(grep -rhoE 'uses:[[:space:]]+[^[:space:]]+' .github/workflows/ \
                | awk '{print $2}' \
                | grep -vE '@[0-9a-f]{40}$' || true)
          if [ -n "$bad" ]; then
            echo "::error::action nao pinada por SHA de commit:"
            printf '  %s\n' $bad
            exit 1
          fi
          echo "ok: todas as actions pinadas por SHA"

      # `npm ci` instala exatamente o que o lockfile manda e aborta quando ele
      # diverge do package.json — por isso nao existe passo separado checando
      # essa consistencia. `npm install` faria o contrario: resolveria algo novo
      # e reescreveria o lockfile dentro do CI.
      - name: Instalar a partir do lockfile
        run: npm ci --ignore-scripts

      - name: Tamanho da arvore instalada
        run: |
          total=$(npm ls --all --parseable 2>/dev/null | tail -n +2 | wc -l)
          echo "pacotes instalados: $total (teto: $MAX_PACKAGES)"
          npm ls --all 2>/dev/null || true
          if [ "$total" -gt "$MAX_PACKAGES" ]; then
            echo "::error::arvore cresceu para $total pacotes, acima do teto de $MAX_PACKAGES."
            echo "Revise o que entrou antes de subir o teto."
            exit 1
          fi

      - name: Vulnerabilidades conhecidas
        run: npm audit --audit-level=moderate
