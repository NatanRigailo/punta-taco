name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA, not a tag. A tag is a moving
      # pointer the action's owner can repoint at any time; a SHA is the only
      # reference an upstream compromise cannot rewrite under us.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      # `npm ci` installs exactly what the lockfile says and fails when
      # package.json and the lockfile disagree. `npm install` would happily
      # resolve something new and rewrite the lockfile in CI.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
